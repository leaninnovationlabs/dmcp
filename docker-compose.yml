services:
  app:
    build:
      context: .
      dockerfile: Dockerfile    
    container_name: dmcp
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8080:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.dmcp.environment=prod"
      - "com.dmcp.service=dmcp"  

networks:
  app_network:
    external: true