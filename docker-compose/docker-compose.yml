services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    container_name: wurf-postgres
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./docker-init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - wurf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dmcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.dmcp.service=postgres"      

  dmcp:
    image: dmcp:latest
    container_name: dmcp
    env_file:
      - .env.dmcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wurf-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:      
      - "com.dmcp.service=dmcp"

  wurf:
    image: wurf:latest
    container_name: wurf    
    ports:
      - "8080:8080"
    env_file:
      - .env.wurf    
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wurf-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:      
      - "com.dmcp.service=wurf"

volumes:
  postgres_data:
    driver: local

networks:
  wurf-network:
    driver: bridge

